name: uko_mobile
description: "UKO mobile app (Flutter port of the Expo app in ../mobile)"
publish_to: "none"
version: 1.1.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # state / DI (same as TV app)
  provider: ^6.1.5+1

  # networking
  http: ^1.6.0
  dio: ^5.9.1
  graphql_flutter: ^5.2.1
  graphql: ^5.2.3
  socket_io_client: ^3.1.4
  crypto: ^3.0.7

  # storage (AsyncStorage replacement, identical key names)
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5

  # UI
  font_awesome_flutter: ^11.0.0
  carousel_slider: ^5.1.2
  youtube_player_iframe: ^5.2.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1

  # video (same stack as TV app)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_vlc_player: ^7.4.4
  video_player: ^2.11.0
  android_intent_plus: any

  # device / location for middleware/report
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  device_info_plus: ^12.0.0
  package_info_plus: ^9.0.0
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter_webrtc: ^1.6.2+hotfix.3
  google_mobile_ads: ^9.1.0
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
